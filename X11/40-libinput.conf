# Touchpad / TrackPoint settings for X11 (i3). Mirrors the sway `input type:touchpad` block.
# Install: sudo cp X11/40-libinput.conf /etc/X11/xorg.conf.d/  (then log out and back in)

Section "InputClass"
        Identifier "touchpad"
        MatchIsTouchpad "on"
        MatchDriver "libinput"
        Option "Tapping" "on"
        Option "NaturalScrolling" "true"
        Option "DisableWhileTyping" "true"
        Option "MiddleEmulation" "true"
        Option "ScrollMethod" "twofinger"
        Option "AccelProfile" "adaptive"
        # -1.0 (slowest) .. 1.0 (fastest); same as sway pointer_accel
        Option "AccelSpeed" "0.3"
EndSection

Section "InputClass"
        Identifier "trackpoint"
        MatchIsPointer "on"
        MatchProduct "TrackPoint"
        MatchDriver "libinput"
        Option "AccelProfile" "adaptive"
        Option "AccelSpeed" "0.3"
EndSection
