#################################
#          Backend              #
#################################
backend = "glx";            # GLX via AMDGPU — best performance
vsync = true;
dithered-present = true;    # reduce banding on gradients

#################################
#           Shadows             #
#################################
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.60;

#################################
#            Fading             #
#################################
fading = true;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-delta = 2;

#################################
#           Corners             #
#################################
corner-radius = 0;

#################################
#            Blur               #
#################################
blur-method = "dual_kawase";
blur-size = 10;
blur-strength = 2;
blur-background = true;
blur-background-frame = false;

#################################
#       Transparency            #
#################################
frame-opacity = 1;

#################################
#       General Settings        #
#################################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

#################################
#          Window Rules         #
#################################
rules: ({
  match = "window_type = 'tooltip'";
  fade = false;
  opacity = 0.85;
}, {
  match = "window_type = 'dock' || window_type = 'desktop'";
  blur-background = false;
  corner-radius = 0;
}, {
  match = "name = 'Notification' || class_g ?= 'Notify-osd' || class_g = 'dunst'";
  shadow = false;
})
