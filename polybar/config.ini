;==========================================================
; Polybar config — ported from waybar (Everforest Dark theme)
; Font: LiterationMono Nerd Font (Nerd Font glyphs included)
;==========================================================

[colors]
; Everforest Dark (the scheme that was active in your waybar style.css)
background = #2b3339
background-light = #323c41
foreground = #d3c6aa
black = #3c474d
red = #e67e80
green = #a7c080
yellow = #dbbc7f
blue = #7fbbb3
magenta = #d699b6
cyan = #83c092
white = #d3c6aa
orange = #e69875
stealth = #919191

[bar/main]
bottom = true
width = 100%
height = 20
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
underline-size = 2
border-size = 0

padding-left = 0
padding-right = 0
module-margin-left = 1
module-margin-right = 2

font-0 = "LiterationMono Nerd Font:pixelsize=10"

modules-left = i3
modules-center =
modules-right = audio-toggle mouse-battery pulseaudio network cpu memory temperature uptime date tray

override-redirect = false

; enable click/scroll actions on internal modules (polybar >= 3.6)
enable-ipc = true

[bar/dvi]
inherit = bar/main
monitor = DVI-D-0
; tray stays on the HDMI bar only — same modules minus the tray
modules-right = audio-toggle mouse-battery pulseaudio network cpu memory temperature uptime date

[module/tray]
type = internal/tray
tray-padding = 3
tray-background = ${colors.background}
; the legacy bar tray capped icons at 16px; keep that size
tray-size = 16

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
wrapping-scroll = false
enable-click = true
enable-scroll = false
fuzzy-match = false

format = <label-state> <label-mode>
label-focused = %index%
label-focused-background = ${colors.background-light}
label-focused-foreground = ${colors.cyan}
label-focused-underline = ${colors.cyan}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-foreground = ${colors.stealth}
label-unfocused-padding = 2
label-visible = %index%
label-visible-foreground = ${colors.stealth}
label-visible-padding = 2
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.black}
label-urgent-padding = 2
label-mode = %mode%
label-mode-foreground = ${colors.orange}
label-mode-padding = 2

[module/audio-toggle]
type = custom/script
exec = ~/.local/bin/toggle_audio.sh watch
tail = true
label = %output%
label-underline = ${colors.stealth}
click-left = ~/.local/bin/toggle_audio.sh

[module/mouse-battery]
type = custom/script
exec = sudo /usr/local/bin/mouse-battery
interval = 300
label = 󰍽 %output:4%
label-underline = ${colors.stealth}
click-left = sudo /usr/local/bin/mouse-battery

[module/pulseaudio]
; custom/script instead of internal/pulseaudio: the internal module keeps a dead
; connection after pipewire-pulse restarts (toggle_audio.sh does that) and then
; crashes the whole bar on the next scroll.
type = custom/script
exec = ~/.local/bin/polybar_volume.sh
tail = true
label = %output%
label-underline = ${colors.stealth}
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol &
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +2%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -2%

[module/network]
type = internal/network
interface = wlo1
interval = 3
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-connected = 󰖩 %essid% (%signal:3%%)
label-connected-underline = ${colors.stealth}
label-disconnected = 󰖪 Disconnected
label-disconnected-foreground = ${colors.red}
click-left = alacritty -e nmtui

; Metric labels use %token:N%, which left-pads the value to at least N chars so
; the bar doesn't shift as numbers change. Longer values still show in full.

[module/cpu]
type = internal/cpu
interval = 1
label = 󰘚 %percentage:3%%
label-underline = ${colors.stealth}
click-left = alacritty -e htop

[module/memory]
type = internal/memory
interval = 1
label = 󰍛 %percentage_used:2%%
label-underline = ${colors.stealth}
click-left = alacritty -e htop

[module/temperature]
type = internal/temperature
interval = 2
; k10temp = AMD CPU. Re-point this if hwmon indices change after a reboot.
hwmon-path = /sys/class/hwmon/hwmon2/temp1_input
warn-temperature = 80
label = 󰔏 %temperature-c:4%
label-underline = ${colors.stealth}
label-warn = 󰔏 %temperature-c:4%
label-warn-foreground = ${colors.red}
click-left = alacritty -e s-tui

[module/uptime]
type = custom/script
exec = uptime -p | sed 's/up //; s/ weeks*/w/; s/ days*/d/; s/ hours*/h/; s/ minutes*/m/'
interval = 60
label = 󰔟 %output:8%
label-underline = ${colors.stealth}

[module/date]
type = internal/date
interval = 1.0
date = %H:%M
date-alt = %Y-%m-%d %H:%M
label = 󰥔 %date%
label-underline = ${colors.stealth}

[settings]
screenchange-reload = true
pseudo-transparency = false

[global/wm]
margin-bottom = 0
